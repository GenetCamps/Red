<style>
/* Layout: sala de control de una planta — barra fija con vistas (resumen → flujo → defectos → adhesivo → armrest → kanban → plan); cada vista abre con su conclusión y baja al detalle. Look oscuro fijo para proyector, identidad DAIMAY. */
:root{
  --bg:#0E1115; --panel:#151A20; --raise:#1D242C; --line:#2A323C;
  --ink:#ECEFF2; --dim:#A2ABB5; --faint:#6B7580;
  --red:#ED3037; --red-t:rgba(237,48,55,.15);
  --ok:#2FBF71; --warn:#F2B01E; --bad:#FF5A5F; --blue:#3E8BFF; --gray:#8B929B; --teal:#2EC4B6;
  --f-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-b:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-b)}
html[lang=zh] body{font-family:"Noto Sans SC",var(--f-b)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mono,.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,17,21,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bi{max-width:1440px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.brand .tri{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:15px solid var(--red);flex:none}
.brand .nm{display:flex;align-items:center;gap:10px;min-width:0}
.k{font:600 11.5px var(--f-d);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.brand h1{margin:0;font:700 22px/1.05 var(--f-d);letter-spacing:.03em;text-transform:uppercase}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:500 11px var(--f-m);padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.seg{display:inline-flex;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--red)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;padding:9px 12px 10px;font-size:13px;font-weight:600;color:var(--dim);display:flex;gap:7px;align-items:center;white-space:nowrap}
nav.tabs button i{font-style:normal;font:600 10.5px var(--f-m);color:var(--faint)}
nav.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--red)}
nav.tabs button[aria-selected=true] i{color:var(--red)}
main{max-width:1440px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section.v{display:flex;flex-direction:column;gap:14px;animation:fin .35s ease both}
@keyframes fin{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.lead{display:flex;flex-direction:column;gap:4px;max-width:980px}
.lead .k{color:var(--dim)}
.lead h2{margin:0;font:700 clamp(24px,3.2vw,38px)/1.05 var(--f-d);letter-spacing:.01em;text-wrap:balance}
.lead h2 em{font-style:normal;color:var(--red)}
.lead p{margin:0;color:var(--dim);font-size:14.5px;max-width:760px}
.g{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media(max-width:980px){.g2,.g3,.g32{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 2px;font:700 16px var(--f-d);letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.card .n{margin:0 0 10px;color:var(--faint);font-size:12px}
.tag{display:inline-block;font:600 10px var(--f-m);letter-spacing:.04em;padding:1px 6px;border-radius:4px;vertical-align:2px;margin-left:6px;white-space:nowrap}
.tag.M{background:rgba(47,191,113,.16);color:#8fe6b6}.tag.E{background:rgba(62,139,255,.16);color:#a9c8ff}.tag.H{background:rgba(242,176,30,.16);color:#ffd88a}.tag.S{background:var(--warn);color:#1a1300}
.safety{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:linear-gradient(90deg,rgba(237,48,55,.22),rgba(237,48,55,.06));border:1px solid var(--red);border-radius:12px;padding:12px 16px}
.safety .ic{width:44px;height:44px;border-radius:10px;background:var(--red);display:grid;place-items:center;font:700 26px var(--f-d);color:#fff}
.safety b{display:block;font:700 18px var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.safety span{color:#ffd5d6;font-size:13px}
.safety .st{font:600 11px var(--f-m);padding:5px 10px;border-radius:6px;background:var(--red);color:#fff;white-space:nowrap;animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.55}}
@media(max-width:700px){.safety{grid-template-columns:auto 1fr}.safety .st{grid-column:1/-1;justify-self:start}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gray);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi.rojo{border-left-color:var(--bad)}.kpi.ambar{border-left-color:var(--warn)}.kpi.verde{border-left-color:var(--ok)}
.kpi small{color:var(--dim);font-size:12px}
.kpi b{font:600 32px/1.05 var(--f-m);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b u{text-decoration:none;font-size:15px;color:var(--dim);margin-left:4px;letter-spacing:0}
.kpi em{font-style:normal;color:var(--faint);font-size:11.5px;line-height:1.35}
.dec{display:flex;flex-direction:column;gap:8px}
.dec li{list-style:none;display:grid;grid-template-columns:34px 1fr;gap:4px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dec li>b{grid-row:span 2;width:34px;height:34px;border-radius:8px;background:var(--raise);display:grid;place-items:center;font:700 18px var(--f-d)}
.dec li.first>b{background:var(--red);color:#fff}
.dec li p{margin:0;font-weight:600;font-size:14.5px}
.dec li dl{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 12px;font-size:12px}
.dec li dt{color:var(--faint);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.dec li dd{margin:0;color:var(--dim)}
@media(max-width:800px){.dec li dl{grid-template-columns:1fr 1fr}}
ul.dec{margin:0;padding:0}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.fr button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.fr button:hover{border-color:var(--red)}
.fr b{font-size:13.5px;display:flex;gap:7px;align-items:center}
.fr small{color:var(--faint);font-size:11.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--gray)}
.dot.rojo{background:var(--bad)}.dot.ambar{background:var(--warn)}.dot.verde{background:var(--ok)}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--f-b);fill:var(--dim);font-size:11px}
svg .t-ink{fill:var(--ink)} svg .t-mono{font-family:var(--f-m)} svg .t-b{font-weight:600}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-weight:500;color:var(--faint);font-size:11px;text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.num,table.t th.num{text-align:right}
.loss{display:flex;flex-direction:column;gap:6px}
.loss div{display:grid;grid-template-columns:minmax(0,1fr) 70px 54px;gap:8px;align-items:center;font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--raise)}
.loss div span:first-child{min-width:0}
.loss div span:nth-child(2){text-align:right;font-family:var(--f-m);font-weight:600}
.loss small{display:block;color:var(--faint);font-size:11px}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pick button{background:var(--raise);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--dim)}
.pick button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.heat{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));gap:4px;max-width:360px}
.heat span{display:grid;place-items:center;font:600 12px var(--f-m);color:var(--faint)}
.heat i{font-style:normal;display:grid;place-items:center;aspect-ratio:1.6;border-radius:6px;font:600 13px var(--f-m);transition:background .3s}
.fish{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.fish div{background:var(--raise);border-radius:10px;padding:10px}
.fish h4{margin:0 0 6px;font:600 12px var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.fish ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.fish li.o{color:var(--dim)}
.val{margin-top:8px;font-size:12.5px;color:var(--ink);background:var(--red-t);border-radius:8px;padding:8px 10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.kframe{position:relative;height:min(92vh,1180px);min-height:620px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b0d10}
.kframe iframe{width:100%;height:100%;border:0;display:block}
.kframe p{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);margin:0}
.note{font-size:12px;color:var(--faint);line-height:1.5}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.yz{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.yz{grid-template-columns:repeat(2,minmax(0,1fr))}}

.stp button[aria-pressed=true][data-st=rev]{background:var(--warn);border-color:var(--warn);color:#2a1d00}
.stp button[aria-pressed=true][data-st=no]{background:var(--bad);border-color:var(--bad);color:#2b0605}

.acta pre{white-space:pre-wrap;font:12px var(--f-m);color:var(--dim);background:var(--raise);border-radius:8px;padding:8px 10px;margin:8px 0 0;max-height:220px;overflow:auto;user-select:all}
.acta .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.acta .sum{display:flex;gap:10px;font:600 12px var(--f-m)}
#phint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;background:rgba(14,17,21,.92);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:600 12px var(--f-m);color:var(--dim)}

 var hh=ev.target.closest("[data-h]");if(hh){heatSel=hh.getAttribute("data-h");render(false);return;}
 var ff=ev.target.closest("[data-f]");if(ff){fishSel=ff.getAttribute("data-f");render(false);return;}
 var dc=ev.target.closest("[data-dec]");if(dc){var n=dc.getAttribute("data-dec"),v=dc.getAttribute("data-st");if(ST[n]===v)delete ST[n];else ST[n]=v;saveActa();var y=window.scrollY;render(false);window.scrollTo(0,y);return;}
 if(ev.target.id==="bCopy"){var txt=actaText(),m=document.getElementById("copyMsg");try{navigator.clipboard.writeText(txt).then(function(){m.textContent=t("copied");},function(){m.textContent=t("copyFail");});}catch(_){m.textContent=t("copyFail");}return;}
 var kk=ev.target.closest("[data-k]");if(kk){takt=+kk.getAttribute("data-k");render(false);return;}
});
document.getElementById("segLang").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;lang=b.getAttribute("data-v");this.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(function(e){e.innerHTML=t(e.getAttribute("data-i"));});if(present)document.getElementById("bFull").innerHTML="✕ "+t("exitP");render(false);});
document.addEventListener("input",function(e){if(e.target.id==="actaNote"){NOTE=e.target.value;saveActa();var pre=document.getElementById("actaPre");if(pre)pre.textContent=actaText();}});
var present=false;
function setPresent(on){present=on;document.body.classList.toggle("present",on);var b=document.getElementById("bFull");b.innerHTML=on?"✕ "+t("exitP"):t("full");updHint();
 var d=document.documentElement;try{if(on&&!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(function(){});if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});}catch(_){}}
function updHint(){var h=document.getElementById("phint");h.hidden=!present;h.textContent=(VIEWS.indexOf(cur)+1)+" / "+VIEWS.length+" · "+t("v_"+cur)+" · "+t("phint");}
document.getElementById("bFull").addEventListener("click",function(){setPresent(!present);});
document.addEventListener("fullscreenchange",function(){if(!document.fullscreenElement&&present)setPresent(false);});
document.addEventListener("keydown",function(e){if(e.target.closest("input,textarea,iframe"))return;if(e.key==="Escape"&&present){setPresent(false);return;}var i=VIEWS.indexOf(cur);if(e.key==="ArrowRight"||e.key==="PageDown"){if(i<VIEWS.length-1)go(VIEWS[i+1],true);}if(e.key==="ArrowLeft"||e.key==="PageUp"){if(i>0)go(VIEWS[i-1],true);}});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(R[h]&&h!==cur){cur=h;render(true);}});
var h0=(location.hash||"").slice(1);if(R[h0])cur=h0;
render(false);
})();
</script>
