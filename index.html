<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red DAIMAY · Gemelos digitales</title>
<meta name="description" content="Mapa 3D del sureste de Coahuila con los gemelos digitales de las plantas DAIMAY (P1, P4, P8 y Parras), portafolio OPEX, Tier 3 y flujos entre plantas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2312161c'/%3E%3Cpath d='M16 6 L27 25 H5 Z' fill='%23ED3037'/%3E%3C/svg%3E">
<style>html,body{margin:0;height:100%;background:#0b0e12}</style>
</head>
<body>
<title>Red de Plantas DAIMAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: mapa regional 3D a pantalla completa · barra de red arriba · gemelo de planta en marco debajo de la barra · panel lateral de módulos a la derecha */
  :root{
    --bg:#0C0F13; --panel:rgba(17,21,27,.93); --solid:#13171D; --raise:#1B2129; --raise2:#232B35; --line:#29313B;
    --text:#E8ECEF; --dim:#9AA3AD; --faint:#636D78;
    --red:#ED3037; --red-d:#B01B22; --red-t:rgba(237,48,55,.14);
    --ok:#2FBF71; --warn:#F2B01E; --bad:#FF5F57; --gray:#8B929B;
    --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
    --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --bar-h:52px; --r:8px;
    color-scheme:dark;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:13px;overflow:hidden;overscroll-behavior:none}
  [hidden]{display:none!important}
  button,select,input,textarea{font-family:inherit;color:inherit;font-size:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  /* ---------- barra de red ---------- */
  #bar{position:fixed;z-index:30;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;min-height:var(--bar-h);box-sizing:border-box;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,rgba(12,15,19,.98),rgba(12,15,19,.9));border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:center;gap:9px;padding-right:4px}
  .brand .tri{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:15px solid var(--red)}
  .brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .brand b i{font-style:normal;color:var(--red)}
  .jumps{display:flex;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:3px}
  .jumps button{background:none;border:0;padding:6px 11px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .jumps button:hover{color:var(--text)}
  .jumps button.on{background:var(--raise2);color:var(--text);box-shadow:inset 0 -2px 0 var(--red)}
  .jumps .dot{width:7px;height:7px;border-radius:50%;background:var(--gray)}
  .search{position:relative;flex:1 1 220px;max-width:420px;min-width:160px}
  .search input{width:100%;box-sizing:border-box;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 30px}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--dim);fill:none;stroke-width:2}
  #sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--solid);border:1px solid var(--line);border-radius:var(--r);max-height:60vh;overflow:auto;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  #sres button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px}
  #sres button:hover,#sres button.sel{background:var(--raise)}
  #sres .k{font-size:10.5px;color:var(--faint);margin-left:auto;white-space:nowrap}
  .pchip{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--raise2);color:var(--text);white-space:nowrap}
  .acts{display:flex;gap:6px;margin-left:auto}
  .btn{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:7px 11px;font-weight:600;font-size:12.5px;white-space:nowrap}
  .btn:hover{border-color:var(--red)}
  .btn.on{border-color:var(--red);color:#fff;background:var(--red-t)}
  .btn.prim{background:var(--red);border-color:var(--red);color:#fff}
  .btn.sm{padding:4px 8px;font-size:11.5px}
  .seal{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
  .seal .k{padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--text)}
  /* ---------- escenario regional ---------- */
  #stage{position:fixed;inset:0;z-index:1}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  #labels{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
  .lbl .card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:110px;box-shadow:0 8px 22px rgba(0,0,0,.45);text-align:left}
  .lbl .card b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;display:block;line-height:1.05}
  .lbl .card small{display:block;color:var(--dim);font-size:11px}
  .lbl .row{display:flex;gap:4px;align-items:center;margin-top:4px}
  .lbl .stem{width:1px;height:22px;background:linear-gradient(var(--line),transparent)}
  .lbl.ghost .card{border-style:dashed;background:rgba(17,21,27,.7)}
  .lbl.ghost .card b{color:var(--dim)}
  .lbl:hover .card{border-color:var(--red)}
  .lbl.city{cursor:default;pointer-events:none;transform:translate(-50%,-50%)}
  .lbl.city span{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .lbl.flow{transform:translate(-50%,-50%)}
  .lbl.flow span{background:var(--solid);border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-size:11px;white-space:nowrap;color:var(--text)}
  .lbl.flow span:hover{border-color:var(--red)}
  .lbl.cluster .card{min-width:150px}
  .sq{display:inline-flex;gap:2px}
  .sq i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;min-width:15px;padding:0 2px;box-sizing:border-box;height:15px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;background:var(--raise2);color:var(--faint)}
  .sq i.verde{background:var(--ok);color:#06210f}.sq i.ambar{background:var(--warn);color:#2a1d00}.sq i.rojo{background:var(--bad);color:#2b0605}
  .badge{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border-radius:99px;background:var(--red-t);color:#ffb3b5;border:1px solid rgba(237,48,55,.35);white-space:nowrap}
  #mapui{position:fixed;z-index:6;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;pointer-events:none}
  .scalebar{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
  .scalebar i{display:block;height:5px;border:1px solid var(--dim);border-top:0;margin-top:3px}
  .north{width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;color:var(--dim);position:relative}
  .north::before{content:'';position:absolute;top:3px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--red)}
  .mapbox{display:flex;flex-direction:column;gap:4px;pointer-events:auto}
  .mapbox .seg{background:var(--panel);backdrop-filter:blur(8px)}
  .attr{font-family:var(--f-mono);font-size:9.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
  .apx{font-family:var(--f-mono);font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px dashed var(--warn);color:var(--warn)}
  .loc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--dim);border:1px dashed rgba(242,176,30,.45);border-radius:6px;padding:6px 8px}
  .loc.ok{border:1px solid rgba(47,191,113,.45)}
  .loc .mono{font-size:10.5px}
  .locedit{display:flex;flex-direction:column;gap:6px;border:1px solid var(--red);border-radius:6px;padding:8px}
  .locedit input{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:7px 8px;color:var(--text)}
  #coord{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);min-width:160px}
  /* ---------- marcos de planta ---------- */
  #frames{position:fixed;z-index:10;left:0;right:0;bottom:0;top:var(--bar-top,var(--bar-h));display:flex;background:var(--bg)}
  #frames iframe{flex:1 1 50%;border:0;min-width:0;height:100%;background:var(--bg)}
  #frames.split iframe+iframe{border-left:2px solid var(--red)}
  #frames .splitlbl{position:absolute;bottom:10px;z-index:2;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--red);color:#fff;padding:2px 8px;border-radius:4px;pointer-events:none}
  #veil{position:fixed;z-index:40;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at center,rgba(19,23,29,.97),rgba(9,11,14,.99));opacity:0;pointer-events:none;transition:opacity .35s}
  #veil.on{opacity:1;pointer-events:auto}
  #veil b{font-family:var(--f-display);font-size:34px;letter-spacing:.06em;text-transform:uppercase}
  #veil span{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);text-align:center;max-width:80vw}
  #veil .bar{width:min(300px,70vw);height:3px;background:var(--line);border-radius:3px;overflow:hidden}
  #veil .bar i{display:block;height:100%;width:30%;background:var(--red);animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
  /* ---------- panel de módulos ---------- */
  #drawer{position:fixed;z-index:25;right:10px;top:calc(var(--bar-top,var(--bar-h)) + 10px);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:400px;max-width:calc(100% - 20px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;padding:10px 2px;font-size:12px;font-weight:600;color:var(--dim)}
  .tabs button.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--red)}
  .tabs .x{flex:0 0 38px;font-size:16px}
  .dbody{flex:1;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
  .dbody>*{flex-shrink:0}
  h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
  h4{margin:0;font-size:12.5px;font-weight:600}
  .note{margin:0;color:var(--dim);font-size:11.5px;line-height:1.5}
  .note b{color:var(--text);font-weight:600}
  .pcard{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.015)}
  .pcard.ghost{border-style:dashed}
  .pcard .hd{display:flex;gap:8px;align-items:baseline}
  .pcard .hd b{font-family:var(--f-display);font-size:19px;letter-spacing:.03em;text-transform:uppercase}
  .pcard .hd small{color:var(--dim)}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .kv div{background:var(--raise);border-radius:6px;padding:5px 7px;min-width:0}
  .kv small{display:block;font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .kv span{font-family:var(--f-mono);font-size:13px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .src{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);line-height:1.5}
  .chip{display:inline-block;font-family:var(--f-mono);font-size:10px;padding:1px 6px;border-radius:99px;white-space:nowrap}
  .chip.dwg{background:rgba(63,178,127,.16);color:#7fe0b0}.chip.pdf{background:rgba(76,141,255,.16);color:#a9c4ff}.chip.est{background:rgba(242,176,30,.14);color:var(--warn)}
  table.t{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
  table.t th,table.t td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
  table.t th:first-child,table.t td:first-child{text-align:left}
  table.t th{color:var(--faint);font-weight:500;font-size:10.5px}
  .twrap{overflow-x:auto}
  .bars{display:flex;flex-direction:column;gap:5px}
  .bars .b{display:grid;grid-template-columns:52px 1fr 64px;gap:6px;align-items:center;font-size:11px}
  .bars .b i{display:block;height:9px;border-radius:2px;background:var(--red)}
  .bars .b i.g{background:var(--gray)}
  .bars .b span{font-family:var(--f-mono);text-align:right;color:var(--dim)}
  .f{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;font-size:12px;color:var(--dim)}
  .f input,.f select,.f textarea{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 7px;min-width:0;width:100%;box-sizing:border-box;color:var(--text)}
  .f textarea{resize:vertical;min-height:52px}
  .seg{display:flex;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:2px;flex-wrap:wrap}
  .seg button{background:none;border:0;padding:4px 8px;border-radius:4px;font-size:11.5px;color:var(--dim)}
  .seg button.on{background:var(--raise2);color:var(--text)}
  .seg button.verde.on{background:var(--ok);color:#06210f}.seg button.ambar.on{background:var(--warn);color:#2a1d00}.seg button.rojo.on{background:var(--bad);color:#2b0605}
  .proj{border:1px solid var(--line);border-radius:var(--r);padding:9px;display:flex;flex-direction:column;gap:5px;cursor:pointer;border-left:4px solid var(--gray)}
  .proj:hover{background:var(--raise)}
  .proj.verde{border-left-color:var(--ok)}.proj.ambar{border-left-color:var(--warn)}.proj.rojo{border-left-color:var(--bad)}
  .proj b{font-size:12.5px}
  .proj .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
  .phase{display:flex;gap:2px}
  .phase i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;padding:1px 4px;border-radius:3px;background:var(--raise2);color:var(--faint)}
  .phase i.done{background:#3a4350;color:var(--text)}.phase i.cur{background:var(--red);color:#fff}
  .tier{border:1px solid var(--line);border-radius:var(--r);padding:9px;display:flex;flex-direction:column;gap:6px}
  .tier .hd{display:flex;gap:8px;align-items:center}
  .tier .hd b{font-family:var(--f-display);font-size:16px;letter-spacing:.03em;text-transform:uppercase;flex:1}
  .hist{display:flex;gap:2px}
  .hist i{width:9px;height:9px;border-radius:2px;background:var(--raise2)}
  .hist i.verde{background:var(--ok)}.hist i.ambar{background:var(--warn)}.hist i.rojo{background:var(--bad)}
  .catrow{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
  .catrow>b{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:4px;background:var(--raise2);display:flex;align-items:center;justify-content:center}
  .catrow .in{display:flex;flex-direction:column;gap:5px;min-width:0}
  .catrow .in .row input{flex:1 1 90px}
  .banner{border:1px solid rgba(242,176,30,.35);background:rgba(242,176,30,.08);color:#ffd88a;border-radius:var(--r);padding:8px 10px;font-size:11.5px}
  details summary{cursor:pointer;color:var(--dim);font-size:12px}
  #cap{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));max-width:min(680px,calc(100% - 32px));background:var(--solid);border:1px solid var(--red);border-radius:var(--r);padding:10px 16px;font-weight:600;font-size:14px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  #cap small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);font-weight:400;margin-bottom:3px}
  #toast{position:fixed;z-index:45;left:50%;transform:translateX(-50%);top:calc(var(--bar-top,var(--bar-h)) + 12px);background:var(--solid);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-size:12.5px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
  #pickbar{position:fixed;z-index:36;left:50%;transform:translateX(-50%);top:calc(var(--bar-top,var(--bar-h)) + 12px);background:var(--solid);border:1px solid var(--red);border-radius:var(--r);padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:12.5px}
  @media (max-width:1500px){ .brand b span{display:none} }
  @media (max-width:900px){
    .acts .lab{display:none}
    #drawer{left:10px;right:10px;width:auto;top:auto;height:58%}
  }
  @media (max-width:700px){ #coord,.attr{display:none} }
  @media (max-width:560px){ #bar{gap:6px;padding-left:10px;padding-right:10px} .seal{display:none} .brand{order:0} .acts{order:1} .jumps{order:2} .search{order:3;flex-basis:100%;max-width:none} .brand b{font-size:18px} }
  @media (prefers-reduced-motion:reduce){ #veil,#veil .bar i{transition:none;animation:none} }
</style>
<div id="stage"></div>
<div id="labels"></div>
<div id="mapui">
  <div class="north" title="Norte">N</div>
  <div class="scalebar" id="scale">20 km<i id="scaleI" style="width:80px"></i></div>
  <div id="coord">Mueve el cursor sobre el mapa</div>
  <div class="mapbox"><div class="seg" id="mapSty" role="group" aria-label="Estilo de mapa"><button data-v="light">Mapa</button><button data-v="dark">Relieve oscuro</button></div><div class="attr">Natural Earth · INEGI · relieve interpolado ×2.4</div></div>
</div>
<div id="frames" hidden></div>
<header id="bar">
  <div class="brand"><div class="tri" aria-hidden="true"></div><b>Red <i>DAIMAY</i><span> · gemelos digitales</span></b></div>
  <nav class="jumps" id="jumps" aria-label="Ir a planta"></nav>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input id="q" type="search" placeholder="Buscar en las plantas: IMM 2400, Línea 9, hornos, andén…" autocomplete="off" aria-label="Buscar en todas las plantas">
    <div id="sres" hidden></div>
  </div>
  <div class="seal" id="seal" hidden></div>
  <div class="acts">
    <button class="btn" id="tourBtn" title="Recorrido guiado por la red">▶ <span class="lab">Recorrido</span></button>
    <button class="btn" id="panelBtn" title="Panel de módulos">☰ <span class="lab">Panel</span></button>
  </div>
</header>
<aside id="drawer" aria-label="Módulos de la red">
  <div class="tabs" id="tabs">
    <button data-t="plantas" class="on">Plantas</button>
    <button data-t="comparar">Comparar</button>
    <button data-t="opex">Portafolio</button>
    <button data-t="tier">Tier 3</button>
    <button data-t="flujos">Flujos</button>
    <button class="x" id="drawerX" aria-label="Cerrar panel">×</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>
<div id="veil" aria-live="polite"><b id="veilT">Planta</b><div class="bar"><i></i></div><span id="veilS"></span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.__NET_HUB = true;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n,d=0) => n==null||Number.isNaN(n) ? '—' : Number(n).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d});
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const NETD = JSON.parse($('#netdata').textContent);

/* =================================================================== GEOGRAFÍA (km, x = este, z = sur) */
const LAT0 = 25.49, LON0 = -101.56, KX = 111.32*Math.cos(LAT0*Math.PI/180), KZ = 110.57;
const geo = (lat,lon) => [ (lon-LON0)*KX, -(lat-LAT0)*KZ ];
const ungeo = (x,z) => [ LAT0 - z/KZ, LON0 + x/KX ];
function haversine(a,b){ const R=6371, r=Math.PI/180; const [la1,lo1]=a, [la2,lo2]=b; const dla=(la2-la1)*r, dlo=(lo2-lo1)*r; const h=Math.sin(dla/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dlo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const MAPM = JSON.parse($('#mapmeta').textContent); const E = MAPM.ext; const EXAG = 2.4;
let RA = geo(25.543234,-100.950782), PARRAS = geo(25.437381,-102.184169);
const CAB = { ramos:[25.543234,-100.950782], parras:[25.437381,-102.184169] };   // cabeceras municipales (INEGI)
const SITE_DEF = {};
Object.entries({ p1:[-2.8,1.0], p2:[-0.8,-2.9], p4:[2.6,-1.6], p67:[3.0,1.9], p8:[0.3,3.3] }).forEach(([id,[dx,dz]])=>{ SITE_DEF[id]=[CAB.ramos[0]-dz/KZ, CAB.ramos[1]+dx/KX]; });
SITE_DEF.parras=[CAB.parras[0], CAB.parras[1]+1.6/KX];
let SITES = {};
const siteOf = id => { const s=SITES[id]; return s && typeof s.lat==='number' ? {ll:[s.lat,s.lon], exact:true, s} : {ll:SITE_DEF[id], exact:false}; };
/* relieve: DEM interpolado de altitudes INEGI (PNG 16 bits en R·G) */
async function loadDEM(){ try{ const img=new Image(); img.src=MAPM.dem.f; await img.decode(); const c=document.createElement('canvas'); c.width=img.width; c.height=img.height; const g=c.getContext('2d',{willReadFrequently:true}); g.drawImage(img,0,0); const d=g.getImageData(0,0,c.width,c.height).data; const H=new Float32Array(c.width*c.height); for(let i=0;i<H.length;i++) H[i]=d[i*4]*256+d[i*4+1]; return {w:c.width,h:c.height,H}; }catch(_){ return null; } }
const DEMH = await loadDEM();
function elevAt(x,z){ if(!DEMH) return 1400; const w=DEMH.w, H=DEMH.H; const u=Math.max(0,Math.min(w-1.001,(x-E.x0)/(E.x1-E.x0)*(w-1))), v=Math.max(0,Math.min(DEMH.h-1.001,(z-E.z0)/(E.z1-E.z0)*(DEMH.h-1))); const i=Math.floor(u), j=Math.floor(v), fx=u-i, fz=v-j;
  return H[j*w+i]*(1-fx)*(1-fz)+H[j*w+i+1]*fx*(1-fz)+H[(j+1)*w+i]*(1-fx)*fz+H[(j+1)*w+i+1]*fx*fz; }
const yAt = (x,z) => (elevAt(x,z)-1000)/1000*EXAG;
const GHOSTS = [
  { id:'p2', name:'Planta 2', short:'P2', ghost:true, site:'Ramos Arizpe', focus:'Taller 5S en línea DT' },
  { id:'p67', name:'Planta 6-7', short:'P6-7', ghost:true, site:'Ramos Arizpe', focus:'P7 recibe y contiene las fundas de Parras · 5S Línea 11 en P6' },
];
const ORDER = ['p1','p2','p4','p67','p8','parras'];
const PL = {}; [...NETD, ...GHOSTS].forEach(p=>{ PL[p.id]=p; });
ORDER.forEach(id=>{ const p=PL[id]; const s=siteOf(id); p.ll=s.ll; p.exact=s.exact; p.pos=geo(...s.ll); p.y=yAt(p.pos[0],p.pos[1]); p.cluster = id!=='parras'; });
const TWINS = ORDER.filter(id=>!PL[id].ghost);
const PLANT_OPTS = ORDER.map(id=>`<option value="${id}">${esc(PL[id].name)}</option>`).join('');

/* =================================================================== ESCENA REGIONAL */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75)); renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0A0D11'); scene.fog = new THREE.Fog('#0A0D11', 260, 620);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08; controls.maxPolarAngle = 1.32; controls.minDistance = 2.2; controls.maxDistance = 420; controls.screenSpacePanning = false;
scene.add(new THREE.HemisphereLight(0xdfe7ef, 0x1a1f26, 1.1));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(-60,120,80); scene.add(sun);
/* terreno real: mapa base (Natural Earth + INEGI) sobre relieve interpolado, con detalle Saltillo–Ramos Arizpe */
const TEXC = {}; const tLoad = new THREE.TextureLoader();
const mapTex = f => { const t=tLoad.load(f); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t; };
const TU = { tBase:{value:null}, tMetro:{value:null}, rBase:{value:new THREE.Vector4(E.x0,E.z0,E.x1,E.z1)}, rMetro:{value:new THREE.Vector4(0,0,1,1)}, uL:{value:new THREE.Vector3(-.55,.75,.35).normalize()} };
const geoT = new THREE.PlaneGeometry(E.x1-E.x0, E.z1-E.z0, 460, 165).rotateX(-Math.PI/2); geoT.translate((E.x0+E.x1)/2,0,(E.z0+E.z1)/2);
{ const pa=geoT.attributes.position; for(let i=0;i<pa.count;i++) pa.setY(i, yAt(pa.getX(i),pa.getZ(i))); geoT.computeVertexNormals(); }
const TERRAIN = new THREE.Mesh(geoT, new THREE.ShaderMaterial({ uniforms:TU,
  vertexShader:`varying vec3 vW; varying vec3 vN; void main(){ vW=(modelMatrix*vec4(position,1.)).xyz; vN=normal; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  fragmentShader:`uniform sampler2D tBase,tMetro; uniform vec4 rBase,rMetro; uniform vec3 uL; varying vec3 vW; varying vec3 vN;
    void main(){ vec2 ub=(vW.xz-rBase.xy)/(rBase.zw-rBase.xy); vec4 c=texture2D(tBase,vec2(ub.x,1.-ub.y));
      vec2 um=(vW.xz-rMetro.xy)/(rMetro.zw-rMetro.xy);
      if(um.x>0.&&um.x<1.&&um.y>0.&&um.y<1.){ float e=min(min(um.x,1.-um.x),min(um.y,1.-um.y)); c=mix(c,texture2D(tMetro,vec2(um.x,1.-um.y)),smoothstep(0.,.05,e)); }
      float l=.88+.2*clamp(dot(normalize(vN),uL),0.,1.);
      gl_FragColor=vec4(c.rgb*l,1.);
      #include <colorspace_fragment>
    }` }));
TERRAIN.name='terrain'; scene.add(TERRAIN);
const UNDER = new THREE.Mesh(new THREE.PlaneGeometry(4000,4000).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color:'#101418'})); UNDER.position.y=-2.2; scene.add(UNDER);
let MAPSTYLE = (()=>{ try{ return localStorage.getItem('net_mapstyle')||'light'; }catch(_){ return 'light'; } })();
function setMapStyle(st){ if(!MAPM.styles[st]) st='light'; MAPSTYLE=st; const S=MAPM.styles[st]; TEXC[st]=TEXC[st]||{base:mapTex(S.base.f),metro:mapTex(S.metro.f)};
  TU.tBase.value=TEXC[st].base; TU.tMetro.value=TEXC[st].metro; TU.rMetro.value.set(S.metro.x0,S.metro.z0,S.metro.x1,S.metro.z1);
  const bg = st==='light' ? '#b9bfc4' : '#0A0D11'; scene.background.set(bg); scene.fog.color.set(bg); UNDER.material.color.set(st==='light'?'#cfd2cd':'#101418');
  try{ localStorage.setItem('net_mapstyle',st); }catch(_){}
  document.querySelectorAll('#mapSty button').forEach(b=>b.classList.toggle('on',b.dataset.v===st)); }
setMapStyle(MAPSTYLE);
document.querySelectorAll('#mapSty button').forEach(b=>b.addEventListener('click',()=>setMapStyle(b.dataset.v)));
const LABELS = []; const LBL = $('#labels');
function addLabel(el, pos, opts={}){ LBL.appendChild(el); const o={el,pos:new THREE.Vector3(pos[0],pos[1]??0,pos[2]),...opts}; LABELS.push(o); return o; }
/* pedestales y miniaturas de cada planta */
const PICKABLE = [];
const TIER_COL = { verde:'#2FBF71', ambar:'#F2B01E', rojo:'#FF5F57', none:'#5a6470' };
const texLoader = new THREE.TextureLoader();
ORDER.forEach(id=>{
  const p=PL[id]; const g=new THREE.Group(); g.position.set(p.pos[0],p.y,p.pos[1]); scene.add(g); p.g=g;
  const R = p.ghost ? .95 : 1.45;
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(R,R*1.06,.14,64).translate(0,.07,0), new THREE.MeshStandardMaterial({color:'#161b21',roughness:.7,metalness:.3}));
  disc.userData.plant=id; PICKABLE.push(disc); g.add(disc);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(R*1.04,.055,8,96).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({color:TIER_COL.none,toneMapped:false})); ring.position.y=.15; g.add(ring); p.ring=ring;
  const halo = new THREE.Mesh(new THREE.RingGeometry(R*1.1,R*1.9,64).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color:TIER_COL.none,transparent:true,opacity:0,depthWrite:false,toneMapped:false})); halo.position.y=.02; g.add(halo); p.halo=halo;
  if(p.ghost){
    const box=new THREE.Mesh(new THREE.BoxGeometry(1.0,.35,.62).translate(0,.32,0),new THREE.MeshStandardMaterial({color:'#3a434d',transparent:true,opacity:.45,roughness:.6})); g.add(box);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.0,.35,.62)),new THREE.LineDashedMaterial({color:'#8B929B',dashSize:.08,gapSize:.06})); e.position.y=.32; e.computeLineDistances(); g.add(e);
    return;
  }
  // miniatura: huellas reales de las naves (polígonos del plano), escaladas al pedestal
  const all=p.polys.flatMap(b=>b.p); const xs=all.map(q=>q[0]), zs=all.map(q=>q[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2, cz=(Math.min(...zs)+Math.max(...zs))/2, ext=Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...zs)-Math.min(...zs));
  const s = 2.15/ext; p.miniS=s; p.miniC=[cx,cz];
  const mini=new THREE.Group(); mini.scale.set(s,s*2.2,s); mini.position.y=.145; g.add(mini);
  const m=p.mini; texLoader.load(m.f, t=>{ t.colorSpace=THREE.SRGBColorSpace; const pl=new THREE.Mesh(new THREE.PlaneGeometry(m.x1-m.x0,m.z1-m.z0).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({map:t,toneMapped:false,transparent:true,opacity:.92}));
    pl.position.set((m.x0+m.x1)/2-cx,.2,(m.z0+m.z1)/2-cz); mini.add(pl); });
  p.polys.forEach(b=>{
    const sh=new THREE.Shape(b.p.map(q=>new THREE.Vector2(q[0]-cx,-(q[1]-cz))));
    const geoE=new THREE.ExtrudeGeometry(sh,{depth:b.h,bevelEnabled:false}).rotateX(-Math.PI/2);
    const mt = b.prop ? new THREE.MeshStandardMaterial({color:'#FFB020',transparent:true,opacity:.28,depthWrite:false}) : new THREE.MeshStandardMaterial({color:'#c9d0d7',roughness:.55,metalness:.15,transparent:true,opacity:.86});
    const me=new THREE.Mesh(geoE,mt); mini.add(me);
    const ed=new THREE.LineSegments(new THREE.EdgesGeometry(geoE,30),new THREE.LineBasicMaterial({color:b.prop?'#FFB020':'#ED3037',transparent:true,opacity:b.prop?.6:.55})); mini.add(ed);
  });
});
// etiquetas de planta y del clúster
function plantLabel(id){ const p=PL[id]; const el=document.createElement('div'); el.className='lbl'+(p.ghost?' ghost':''); el.tabIndex=0;
  el.innerHTML=`<div class="card"><b>${esc(p.name)}</b><small>${esc(p.ghost?'sin gemelo · falta plano':p.sub)}</small><div class="row"><span class="sq" data-sq="${id}"></span><span class="badge" data-op="${id}" hidden></span><span class="apx" data-apx="${id}" title="Ubicación aproximada: fíjala con coordenadas de Google Maps en la pestaña Plantas">aprox.</span></div></div><div class="stem"></div>`;
  el.addEventListener('click',()=>onPlantClick(id)); el.addEventListener('keydown',e=>{ if(e.key==='Enter') onPlantClick(id); });
  p.lbl = addLabel(el,[p.pos[0],p.y+1.2,p.pos[1]],{plant:id,cluster:p.cluster}); return p.lbl; }
ORDER.forEach(plantLabel);
const clusterEl=document.createElement('div'); clusterEl.className='lbl cluster'; clusterEl.innerHTML=`<div class="card"><b>Ramos Arizpe</b><small>5 plantas · 3 con gemelo</small><div class="row"><span class="sq" data-sq="cluster"></span><span class="badge" data-op="cluster" hidden></span></div></div><div class="stem"></div>`;
clusterEl.addEventListener('click',()=>flyTo([RA[0],0,RA[1]],16,.82,0));
const CLUSTER = addLabel(clusterEl,[RA[0],1.6,RA[1]],{isCluster:true});
function placePlants(){
  ORDER.forEach(id=>{ const p=PL[id]; const s=siteOf(id); p.ll=s.ll; p.exact=s.exact; p.pos=geo(...s.ll); p.y=yAt(p.pos[0],p.pos[1]);
    p.g.position.set(p.pos[0],p.y,p.pos[1]); p.lbl.pos.set(p.pos[0],p.y+1.2,p.pos[1]); });
  // escala de pedestal: si dos plantas quedan cerca, el pedestal se encoge para no encimarse
  ORDER.forEach(id=>{ const p=PL[id]; const R0=p.ghost?.95:1.45; let dmin=1e9; ORDER.forEach(o=>{ if(o!==id){ const q=PL[o]; dmin=Math.min(dmin,Math.hypot(p.pos[0]-q.pos[0],p.pos[1]-q.pos[1])); } });
    const k=Math.max(.14,Math.min(1,(dmin*.46)/R0)); p.g.scale.setScalar(k); p.k=k; p.lbl.pos.y=p.y+.3+.9*k; });
  const cl=ORDER.filter(id=>PL[id].cluster).map(id=>PL[id]); RA=[cl.reduce((t,p)=>t+p.pos[0],0)/cl.length, cl.reduce((t,p)=>t+p.pos[1],0)/cl.length]; PARRAS=PL.parras.pos;
  CLUSTER.pos.set(RA[0],yAt(RA[0],RA[1])+1.6,RA[1]);
  document.querySelectorAll('[data-apx]').forEach(el=>{ el.hidden=!!PL[el.dataset.apx].exact; });
  buildFlows();
}
const clusterLL = () => ungeo(RA[0],RA[1]);

/* =================================================================== FLUJOS ENTRE PLANTAS */
const FLOW_G = new THREE.Group(); scene.add(FLOW_G);
let FLOWS=[], FLOW_OBJS=[];
const FLOW_COL = { material:'#cfd6dd', calidad:'#ED3037', informacion:'#4C8DFF' };
function buildFlows(){
  FLOW_OBJS.forEach(o=>{ FLOW_G.remove(o.line); FLOW_G.remove(o.pts); o.lbl.el.remove(); LABELS.splice(LABELS.indexOf(o.lbl),1); }); FLOW_OBJS=[];
  if(!PL.parras.g) return;
  FLOWS.forEach(f=>{
    const A=PL[f.from], B=PL[f.to]; if(!A||!B||A===B) return;
    const a=new THREE.Vector3(A.pos[0],A.y+.3,A.pos[1]), b=new THREE.Vector3(B.pos[0],B.y+.3,B.pos[1]); const d=Math.hypot(a.x-b.x,a.z-b.z);
    const mid=a.clone().add(b).multiplyScalar(.5); mid.y=Math.max(a.y,b.y)+Math.max(1.6,d*.2);
    const curve=new THREE.QuadraticBezierCurve3(a,mid,b);
    const col=new THREE.Color(FLOW_COL[f.kind]||FLOW_COL.material);
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(80)),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.75,toneMapped:false})); FLOW_G.add(line);
    const n=14, arr=new Float32Array(n*3); const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(arr,3));
    const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:col,size:5,sizeAttenuation:false,toneMapped:false})); FLOW_G.add(pts);
    const km=haversine(A.ll,B.ll);
    const el=document.createElement('div'); el.className='lbl flow'; el.innerHTML=`<span>${esc(A.short)} → ${esc(B.short)} · ${esc(f.what||'flujo')}</span>`;
    el.addEventListener('click',()=>{ openDrawer('flujos'); renderFlows(f.id); });
    const lbl=addLabel(el,[curve.getPoint(.5).x,curve.getPoint(.5).y,curve.getPoint(.5).z],{flow:f.id, near: d<20});
    FLOW_OBJS.push({f,curve,pts,line,lbl,n,km,ph:Math.random()});
  });
}

function flyTo(t,dist,polar,azim,dur=1.4){

async function enterPlant(id, after){
  const p=PL[id]; if(!p) return;
  if(p.ghost){ onPlantClick(id); return; }
  if(SPLIT) exitSplit(false);
  if(MODE==='plant' && CUR===id){ if(after) await runAfter(id,after); return; }
  if(MODE==='red'){ const az=Math.atan2(camera.position.x-controls.target.x, camera.position.z-controls.target.z); await flyTo([p.pos[0],0,p.pos[1]],3.6,.95,az,1.1); }
  veil(true, p.name, `${p.kind} · ${p.file}`);
  await sleep(260);
  const f = FR.get(id) || makeFrame(id);
  MODE='plant'; CUR=id; showFrames([id]); setBar();
  if(innerWidth<900) closeDrawer(); else if(!$('#drawer').hidden && TAB==='plantas') closeDrawer();
  const t0=performance.now();
  await Promise.race([f.loadP, sleep(9000)]);
  veil(false);
  const ok = await Promise.race([f.readyP.then(()=>true), sleep(45000).then(()=>false)]);
  if(!ok && !f.hello){ veil(true,'No se pudo abrir '+p.name, 'Ábrelo como gemelo independiente desde la pestaña Plantas.'); setTimeout(()=>veil(false),4500); return; }
  if(after) await runAfter(id,after);
}

let DB=null, USER=null, ME=null, DLS=null, DBDONE=false;
const SUBS=new Map();
function dropSubs(plant){ SUBS.forEach((s,k)=>{ if(s.plant===plant){ try{ s.un(); }catch(_){} SUBS.delete(k); } }); }
const ser = s => ({id:s.id, exists:!!s.exists, data:s.exists?s.data():undefined});
addEventListener('message', async e=>{
  const m=e.data; if(!m||m.src!=='plant') return;
  const f=[...FR.values()].find(x=>x.ifr.contentWindow===e.source); if(!f) return;
  const reply=(o)=>postNow(f,o);
  if(m.type==='hello'){ f.hello=true; dropSubs(f.id); return; }
  if(m.type==='ready'){ f.ready=true; f.readyR(); postNow(f,{cmd:'pause',v:f.ifr.hidden}); if(f.q2) postNow(f,{cmd:'quality',v:f.q2}); const q=f.q; f.q=[]; q.forEach(x=>postNow(f,x)); sendPins(f.id); escalate(f.id); return; }
  if(m.type==='picked'){ onPicked(f.id,m.x,m.z); return; }
  if(m.type==='pin'){ openDrawer('opex'); renderOpex(m.id); return; }
  if(m.type==='db'){
    const mp=p=>'pl/'+f.id+'/'+p;
    try{
      if(m.op==='avail') return reply({cmd:'dbres',rid:m.rid,ok:true,val:!!DB});
      if(!DB) throw {code:'unavailable'};
      if(m.op==='get'){ const s=await DB.doc(mp(m.path)).get(); return reply({cmd:'dbres',rid:m.rid,ok:true,val:ser(s)}); }
      if(m.op==='getq'){ const q=await DB.collection(mp(m.path)).get(); return reply({cmd:'dbres',rid:m.rid,ok:true,val:q.docs.map(ser)}); }
      if(m.op==='set'){ await DB.doc(mp(m.path)).set(m.data); return reply({cmd:'dbres',rid:m.rid,ok:true}); }
      if(m.op==='update'){ await DB.doc(mp(m.path)).update(m.data); return reply({cmd:'dbres',rid:m.rid,ok:true}); }
      if(m.op==='delete'){ await DB.doc(mp(m.path)).delete(); return reply({cmd:'dbres',rid:m.rid,ok:true}); }
      if(m.op==='sub'){ const ref = m.kind==='doc' ? DB.doc(mp(m.path)) : DB.collection(mp(m.path));
        const un = ref.onSnapshot(s=>{ if(m.kind==='doc') reply({cmd:'dbsnap',sid:m.sid,doc:ser(s)}); else reply({cmd:'dbsnap',sid:m.sid,docs:s.docs.map(ser)}); }, er=>reply({cmd:'dberr',sid:m.sid,err:{code:er?.code||'unavailable'}}));
        SUBS.set(m.sid,{un,plant:f.id}); return; }
      if(m.op==='unsub'){ const s=SUBS.get(m.sid); if(s){ s.un(); SUBS.delete(m.sid); } return; }
    }catch(er){ if(m.rid) reply({cmd:'dbres',rid:m.rid,ok:false,err:{code:er?.code||'unavailable',message:er?.message||''}}); }
  }
});

let PROJ=[], TIER=[], PROFILES={};
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
let TDATE = today();
const RANK={verde:1,ambar:2,rojo:3};
function worst(cats){ let w=null; Object.values(cats||{}).forEach(c=>{ if(c&&c.st&&RANK[c.st] && (!w||RANK[c.st]>RANK[w])) w=c.st; }); return w; }
function tierDoc(id,date=TDATE){ return TIER.find(t=>t.plant===id && t.date===date); }
function tierOf(id){ const t=tierDoc(id); return (t && worst(t.cats)) || 'none'; }
function paintTier(){
  ORDER.forEach(id=>{ const p=PL[id]; const st=tierOf(id); const c=new THREE.Color(TIER_COL[st]); p.ring.material.color.copy(c); p.halo.material.color.copy(c); p.halo.material.opacity = st==='rojo'?.22:st==='ambar'?.14:st==='verde'?.08:0; });
  document.querySelectorAll('[data-sq]').forEach(el=>{ const id=el.dataset.sq;
    if(id==='cluster'){ const sts=ORDER.filter(x=>PL[x].cluster).map(tierOf); el.innerHTML=ORDER.filter(x=>PL[x].cluster).map((x,i)=>`<i class="${sts[i]!=='none'?sts[i]:''}" title="${esc(PL[x].name)}">${esc(PL[x].short.replace('P',''))}</i>`).join(''); return; }
    const t=tierDoc(id); el.innerHTML='SQDCP'.split('').map(k=>`<i class="${t?.cats?.[k]?.st||''}" title="${k}">${k}</i>`).join(''); });
  document.querySelectorAll('[data-op]').forEach(el=>{ const id=el.dataset.op; const n = id==='cluster' ? PROJ.filter(p=>PL[p.plant]?.cluster).length : PROJ.filter(p=>p.plant===id).length; el.hidden=!n; el.textContent=`OPEX ${n}`; });
  setBar();
}
function sendPins(id){ post(id,{cmd:'pins',pins:PROJ.filter(p=>p.plant===id && typeof p.x==='number').map(p=>({id:p.id,name:p.name,x:p.x,z:p.z,status:p.status||'gris',type:p.type,phase:p.phase,owner:p.owner}))}); }
function escalate(id){ const t=tierDoc(id,today()); if(!t) return; const st=worst(t.cats); if(st!=='rojo'&&st!=='ambar') return;
  const z=(PL[id].zones||[]).find(z=>z.n===t.zone); const bad=Object.entries(t.cats||{}).filter(([k,c])=>c?.st===st).map(([k])=>k).join(' ');
  const lab=`Tier 3 · ${bad} ${st==='rojo'?'en rojo':'en ámbar'}`;
  if(z&&z.rect) post(id,{cmd:'highlight',x0:z.rect[0],z0:z.rect[1],x1:z.rect[2],z1:z.rect[3],color:TIER_COL[st],label:lab});
  else if(z) post(id,{cmd:'focus',x:z.x,z:z.z,r:30,label:lab,color:TIER_COL[st]});
  toast(`${PL[id].name}: ${lab}${t.zone?' · '+t.zone:''}`,5200); }
async function resolveNames(ids){ if(!USER) return; const u=[...new Set(ids.filter(Boolean))]; if(!u.length) return; try{ const ps=await USER.profiles(u); Object.assign(PROFILES,ps); }catch(_){} }

/* =================================================================== MODO ESTÁTICO (GitHub Pages): base de datos local con la misma API */
const STATIC = !window.claude?.use;
const LKEY = 'reddaimay_db_v1';
const LocalDB = (()=>{
  let mem = null, memOnly = false;
  const load = () => { if(mem) return mem; let raw=null; try{ raw=localStorage.getItem(LKEY); }catch(_){ memOnly=true; }
    if(raw){ try{ mem=JSON.parse(raw); }catch(_){ mem=null; } }
    if(!mem){ mem={}; try{ const s=JSON.parse(document.getElementById('seed')?.textContent||'{}'); Object.assign(mem,s); }catch(_){} persist(); }
    return mem; };
  const persist = () => { if(memOnly) return; try{ localStorage.setItem(LKEY, JSON.stringify(mem)); }catch(_){ memOnly=true; } };
  const subs = new Set();
  const clone = o => o==null ? o : JSON.parse(JSON.stringify(o));
  const notify = () => subs.forEach(s=>{ try{ s(); }catch(_){} });
  const kick = () => setTimeout(notify, 0);
  addEventListener('storage', e=>{ if(e.key===LKEY){ mem=null; load(); notify(); } });
  const snapDoc = (path) => { const d=load()[path]; return {id:path.split('/').pop(), exists:d!==undefined, data:()=>clone(d), metadata:{fromCache:true,hasPendingWrites:false}}; };
  const rid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const docRef = path => ({ id:path.split('/').pop(), path,
    get: async () => snapDoc(path),
    set: async d => { load()[path]=clone(d); persist(); kick(); },
    update: async d => { const db=load(); if(db[path]===undefined) throw {code:'not-found',message:'el documento no existe'}; db[path]={...db[path],...clone(d)}; persist(); kick(); },
    delete: async () => { delete load()[path]; persist(); kick(); },
    onSnapshot: (n) => { const f=()=>n(snapDoc(path)); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); },
    collection: c => colRef(path+'/'+c) });
  const colRef = (path, opt={}) => {
    const run = () => { const db=load(), pre=path+'/'; let ds=Object.keys(db).filter(k=>k.startsWith(pre) && !k.slice(pre.length).includes('/')).map(snapDoc);
      (opt.where||[]).forEach(([f,op,v])=>{ ds=ds.filter(s=>{ const x=s.data()?.[f]; return op==='=='?x===v:op==='!='?x!==v:op==='<'?x<v:op==='<='?x<=v:op==='>'?x>v:op==='>='?x>=v:op==='in'?(v||[]).includes(x):op==='array-contains'?(x||[]).includes(v):true; }); });
      if(opt.order){ const [f,dir]=opt.order; ds.sort((a,b)=>{ const x=a.data()?.[f], y=b.data()?.[f]; const c = x===y?0 : (x==null?-1 : y==null?1 : x<y?-1:1); return dir==='desc'?-c:c; }); }
      if(opt.limit) ds=ds.slice(0,opt.limit);
      return {docs:ds, size:ds.length, empty:!ds.length, docChanges:()=>[], forEach:fn=>ds.forEach(fn), metadata:{fromCache:true,hasPendingWrites:false}}; };
    return { path,
      doc: id => docRef(path+'/'+(id||rid())),
      add: async d => { const r=docRef(path+'/'+rid()); await r.set(d); return r; },
      get: async () => run(),
      onSnapshot: (n) => { const f=()=>n(run()); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); },
      where: (f,op,v) => colRef(path,{...opt, where:[...(opt.where||[]),[f,op,v]]}),
      orderBy: (f,dir='asc') => colRef(path,{...opt, order:[f,dir]}),
      limit: n => colRef(path,{...opt, limit:n}) };
  };
  return { doc:docRef, collection:colRef,
    exportAll: () => clone(load()),
    importAll: obj => { mem=clone(obj)||{}; persist(); notify(); },
    reset: () => { mem=null; try{ localStorage.removeItem(LKEY); }catch(_){} load(); notify(); },
    get volatile(){ load(); return memOnly; } };
})();
const LocalDL = { save: async ({filename,data}) => { const blob = data instanceof Blob ? data : new Blob([data],{type: /\.csv$/i.test(filename)?'text/csv;charset=utf-8':/\.json$/i.test(filename)?'application/json':'application/octet-stream'});
  const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); } };
const twinHref = p => STATIC ? `${p.id}.html` : p.twin;
async function initDB(){
  try{
    if(STATIC){ DB=LocalDB; DLS=LocalDL; ME='local'; PROFILES.local={name:'este navegador'}; DBDONE=true; }
    else { const [db,user,dl]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);
      DB=db; USER=user; DLS=dl; DBDONE=true; if(USER){ try{ ME=await USER.id(); }catch(_){} } }
    if(!DB){ renderAll(); return; }
    DB.collection('portfolio').onSnapshot(s=>{ PROJ=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})); PROJ.sort((a,b)=>(a.plant||'').localeCompare(b.plant||'')||(a.name||'').localeCompare(b.name||'')); paintTier(); FR.forEach((f,id)=>sendPins(id)); if(TAB==='opex') renderOpex(); }, e=>toast('Portafolio no disponible ('+(e?.code||'')+')'));
    DB.doc('config/sites').onSnapshot(sn=>{ SITES = sn.exists ? (sn.data()||{}) : {}; placePlants(); if(TAB==='plantas'&&!LOCEDIT) renderPlantas(); }, ()=>{});
    DB.collection('flows').onSnapshot(s=>{ FLOWS=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})); buildFlows(); if(TAB==='flujos') renderFlows(); }, ()=>{});
    DB.collection('tier3').orderBy('date','desc').limit(800).onSnapshot(async s=>{ TIER=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})); await resolveNames(TIER.map(t=>t.by)); paintTier(); if(TAB==='tier') renderTier(); if(TAB==='plantas') renderPlantas(); }, ()=>{});
  }catch(_){ DBDONE=true; }
  renderAll();
}

});
function renderAll(){ setTab(TAB); paintTier(); }
/* ---------- Plantas */
let LOCEDIT=null;
function parseLL(str){ const s=String(str||'').trim();
  const m=s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)||s.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/)||s.match(/[?&](?:q|ll|query|center|destination)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/i)||s.match(/(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/);
  if(!m) return {err:'No encontré coordenadas. Pega algo como 25.53938, -100.95634 o el enlace de Google Maps.'};
  let la=+m[1], lo=+m[2]; if(Math.abs(la)>90){ [la,lo]=[lo,la]; }
  if(la<E.S-0.6||la>E.N+0.6||lo<E.W-0.6||lo>E.E+0.6) return {err:`Esas coordenadas (${la.toFixed(4)}, ${lo.toFixed(4)}) quedan fuera del sureste de Coahuila. Revisa que la longitud lleve el signo menos.`};
  return {lat:+la.toFixed(6), lon:+lo.toFixed(6)}; }
async function saveSite(id,ll){ if(!DB){ toast('Sin base de datos en esta vista'); return false; }
  const next={...SITES}; if(ll) next[id]={lat:ll.lat,lon:ll.lon,by:ME||null,ts:new Date().toISOString(),src:'Google Maps'}; else delete next[id];
  try{ await DB.doc('config/sites').set(next); SITES=next; placePlants(); return true; }catch(e){ toast('No se guardó la ubicación ('+(e?.code||'error')+')'); return false; } }
function locBlock(id){ const p=PL[id]; const [la,lo]=p.ll;
  if(LOCEDIT===id) return `<div class="locedit"><label class="note" for="ll_${id}">Pega las coordenadas o el enlace de Google Maps</label><input id="ll_${id}" placeholder="25.53938, -100.95634" autocomplete="off"><p class="note">En Google Maps: clic derecho sobre la nave → clic en las coordenadas (se copian) → pégalas aquí. También sirve el enlace de “Compartir”.</p><p class="note" id="llerr_${id}" style="color:var(--bad)"></p><div class="row"><button class="btn sm prim" data-llsave="${id}">Guardar ubicación</button><button class="btn sm" data-llcancel="${id}">Cancelar</button>${p.exact?`<span style="flex:1"></span><button class="btn sm" data-llclear="${id}">Volver a aproximada</button>`:''}</div></div>`;
  return `<div class="loc ${p.exact?'ok':''}"><span>📍 ${p.exact?'Ubicación fijada':'Ubicación aproximada'}</span><span class="mono">${la.toFixed(5)}, ${lo.toFixed(5)}</span><span style="flex:1"></span><button class="btn sm" data-ll="${id}" ${DB?'':'disabled'}>${p.exact?'Cambiar':'Fijar con Google Maps'}</button></div>`; }
function renderPlantas(focusId){
  const cards=ORDER.map(id=>{ const p=PL[id]; const t=tierDoc(id); const n=PROJ.filter(x=>x.plant===id).length;
    if(p.ghost) return `<div class="pcard ghost" id="pc_${id}"><div class="hd"><b>${esc(p.name)}</b><small>${esc(p.site)}</small></div><p class="note">${esc(p.focus)}</p>${locBlock(id)}<p class="note">Sin gemelo: falta el plano. Ya puede capturar su Tier 3 y tener proyectos en el portafolio.</p><div class="row"><span class="sq">${'SQDCP'.split('').map(k=>`<i class="${t?.cats?.[k]?.st||''}">${k}</i>`).join('')}</span>${n?`<span class="badge">OPEX ${n}</span>`:''}</div></div>`;
    const m=p.met;
    return `<div class="pcard" id="pc_${id}"><div class="hd"><b>${esc(p.name)}</b><small>${esc(p.sub)} · ${esc(p.site)}</small></div>
      <div class="kv"><div><small>Superficie</small><span>${fmt(m.area)} m²</span></div><div><small>Operadores</small><span>${fmt(m.ops)}</span></div><div><small>m² / op</small><span>${fmt(m.m2op,1)}</span></div></div>
      <p class="note">${esc(p.focus)}</p>
      ${locBlock(id)}
      <div class="src"><span class="chip ${p.kind==='PDF'?'pdf':'dwg'}">${p.kind}</span> ${esc(p.file)}<br>Plano ${esc(p.drawn)} · gemelo construido ${esc(p.built)} · alturas y modelos 3D <span class="chip est">EST</span></div>
      <div class="row"><span class="sq">${'SQDCP'.split('').map(k=>`<i class="${t?.cats?.[k]?.st||''}">${k}</i>`).join('')}</span>${n?`<span class="badge">OPEX ${n}</span>`:''}<span style="flex:1"></span><a class="btn sm" href="${twinHref(p)}" target="_blank" rel="noopener">Gemelo solo ↗</a><button class="btn sm prim" data-enter="${id}">Entrar</button></div></div>`; }).join('');
  const pend=ORDER.filter(id=>!PL[id].exact).length;
  body().innerHTML=`<h3>Plantas de la red</h3><p class="note">Clic en una planta del mapa o en <b>Entrar</b>. Las cuatro plantas con gemelo usan el mismo motor y el mismo puente con la red; cada una se descarga solo al entrar.</p>
    ${pend?`<div class="banner">${pend} de ${ORDER.length} plantas tienen ubicación aproximada (alrededor de la cabecera municipal). Fíjalas con las coordenadas de Google Maps y el mapa las coloca en su punto real para todos.</div>`:''}${cards}
    <p class="note">Mapa: carreteras, vías y límites estatales de Natural Earth (escala 1:10 M, trazo generalizado); localidades y altitudes del catálogo INEGI; relieve interpolado de esas altitudes, exagerado ×${EXAG}. Ramos Arizpe–Parras ≈${fmt(haversine(PL.parras.ll,clusterLL()),0)} km en línea recta.</p>`;
  body().querySelectorAll('[data-enter]').forEach(b=>b.addEventListener('click',()=>enterPlant(b.dataset.enter)));
  body().querySelectorAll('[data-ll]').forEach(b=>b.addEventListener('click',()=>{ LOCEDIT=b.dataset.ll; renderPlantas(LOCEDIT); setTimeout(()=>$('#ll_'+LOCEDIT)?.focus(),30); }));
  body().querySelectorAll('[data-llcancel]').forEach(b=>b.addEventListener('click',()=>{ LOCEDIT=null; renderPlantas(); }));
  body().querySelectorAll('[data-llclear]').forEach(b=>b.addEventListener('click',async()=>{ const id=b.dataset.llclear; if(await saveSite(id,null)){ LOCEDIT=null; toast(PL[id].name+': vuelve a ubicación aproximada'); renderPlantas(id); } }));
  body().querySelectorAll('[data-llsave]').forEach(b=>b.addEventListener('click',async()=>{ const id=b.dataset.llsave; const r=parseLL($('#ll_'+id).value); if(r.err){ $('#llerr_'+id).textContent=r.err; return; }
    if(await saveSite(id,r)){ LOCEDIT=null; toast(`${PL[id].name} fijada en ${r.lat}, ${r.lon}`); renderPlantas(id); if(MODE==='red'){ const p=PL[id]; flyTo([p.pos[0],0,p.pos[1]],7,.8,0); } } }));
  body().querySelectorAll('.locedit input').forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter') body().querySelector('[data-llsave]')?.click(); }));
  if(focusId){ const el=$('#pc_'+focusId); if(el){ el.scrollIntoView({block:'nearest'}); el.style.borderColor='var(--red)'; } }
}
/* ---------- Comparar */
function renderComparar(){
  const P=TWINS.map(id=>PL[id]);
  const bar=(k,lab,fmtd=0)=>{ const vals=P.map(p=>p.met[k]||0); const mx=Math.max(...vals); return `<h4>${lab}</h4><div class="bars">${P.map(p=>`<div class="b"><span style="text-align:left;color:var(--text)">${esc(p.short)}</span><i class="${p.id==='parras'&&k==='m2op'?'':'g'}" style="width:${mx?Math.max(2,100*(p.met[k]||0)/mx):0}%"></i><span>${fmt(p.met[k],fmtd)}</span></div>`).join('')}</div>`; };
  const row=(lab,f)=>`<tr><td>${lab}</td>${P.map(p=>`<td>${f(p)}</td>`).join('')}</tr>`;
  body().innerHTML=`<h3>Comparativo entre plantas</h3><p class="note">Todo sale de los planos, sin captura. Los operadores son los símbolos dibujados en cada layout, no la plantilla real.</p>
   <div class="twrap"><table class="t"><thead><tr><th></th>${P.map(p=>`<th>${esc(p.short)}</th>`).join('')}</tr></thead><tbody>
    ${row('Fuente',p=>`<span class="chip ${p.kind==='PDF'?'pdf':'dwg'}">${p.kind}</span>`)}
    ${row('Superficie techada',p=>fmt(p.met.area)+' m²')}
    ${row('Naves / anexos',p=>fmt(p.met.blds))}
    ${row('Operadores en plano',p=>fmt(p.met.ops))}
    ${row('m² por operador',p=>fmt(p.met.m2op,1))}
    ${row('Columnas',p=>fmt(p.met.cols))}
    ${row('Puertas y andenes',p=>p.met.docks?fmt(p.met.docks):'—')}
    ${row('Racks',p=>esc(p.met.racks))}
    ${row('Equipo mayor',p=>esc(p.met.eq[0]||'—'))}
    ${row('Pasillo marcado¹',p=>p.met.aislePct!=null?fmt(p.met.aislePct,1)+' %':'—')}
   </tbody></table></div>
   <p class="note">¹ Cada plano marca pasillos con criterio distinto (P8 incluye calles de almacén), así que no compares ese renglón entre plantas.</p>
   ${bar('area','Superficie techada (m²)')}${bar('ops','Operadores en plano')}${bar('m2op','m² por operador',1)}
   <p class="note"><b>Lectura:</b> Parras trabaja con ${fmt(PL.parras.met.m2op,1)} m² por operador contra ${fmt(Math.min(PL.p1.met.m2op,PL.p4.met.m2op,PL.p8.met.m2op),0)}–${fmt(Math.max(PL.p1.met.m2op,PL.p4.met.m2op,PL.p8.met.m2op),0)} en las plantas de inyección y ensamble. La costura es intensiva en mano de obra: ahí la densidad pesa en ergonomía, evacuación y flujo de surtido más que en cualquier otra planta.</p>
   <h3>Lado a lado</h3>
   <div class="f"><label for="spA">Izquierda</label><select id="spA">${TWINS.map(id=>`<option value="${id}">${esc(PL[id].name)}</option>`).join('')}</select></div>
   <div class="f"><label for="spB">Derecha</label><select id="spB">${TWINS.map(id=>`<option value="${id}" ${id==='parras'?'selected':''}>${esc(PL[id].name)}</option>`).join('')}</select></div>
   <div class="row"><button class="btn prim" id="spGo">Ver lado a lado</button>${SPLIT?'<button class="btn" id="spX">Salir de lado a lado</button>':''}</div>
   <p class="note">Abre dos gemelos al mismo tiempo, cada uno con sus controles. Pide más memoria; en celular se ven uno sobre otro.</p>`;
  $('#spGo').addEventListener('click',()=>{ const a=$('#spA').value,b=$('#spB').value; if(a===b){ toast('Elige dos plantas distintas'); return; } enterSplit(a,b); });
  $('#spX')?.addEventListener('click',()=>exitSplit(true));
}
/* ---------- Portafolio OPEX */
const PHASES=['Define','Measure','Analyze','Improve','Control'];
const TYPES=['DMAIC','Kaizen','5S','Sistema digital','Estudio','Acción de ingeniería'];
const STN={verde:'En tiempo',ambar:'En riesgo',rojo:'Atrasado',gris:'Sin evaluar'};
let opexF={plant:'',st:''}, opexEdit=null;
function phaseBar(ph){ const i=PHASES.indexOf(ph); if(i<0) return ph?`<span class="pchip">${esc(ph)}</span>`:''; return `<span class="phase">${PHASES.map((x,k)=>`<i class="${k<i?'done':k===i?'cur':''}">${x[0]}</i>`).join('')}</span>`; }
function renderOpex(openId){
  if(opexEdit){ return renderOpexForm(opexEdit); }
  const L=PROJ.filter(p=>(!opexF.plant||p.plant===opexF.plant)&&(!opexF.st||(p.status||'gris')===opexF.st));
  const cnt=k=>PROJ.filter(p=>(p.status||'gris')===k).length;
  body().innerHTML=`${noDB()}<h3>Portafolio OPEX</h3><p class="note">Cada proyecto vive en su planta: con ubicación aparece como pin dentro del gemelo; sin ella, como contador en el mapa.</p>
   <div class="row"><div class="seg" id="opSt">${['','verde','ambar','rojo','gris'].map(k=>`<button data-v="${k}" class="${k} ${opexF.st===k?'on':''}">${k?STN[k]+' '+cnt(k):'Todos '+PROJ.length}</button>`).join('')}</div></div>
   <div class="f"><label for="opPl">Planta</label><select id="opPl"><option value="">Todas</option>${PLANT_OPTS}<option value="regional">Regional / varias</option></select></div>
   <div class="row"><button class="btn prim" id="opNew" ${DB?'':'disabled'}>+ Nuevo proyecto</button><button class="btn" id="opCsv" ${DLS&&PROJ.length?'':'disabled'}>Descargar CSV</button></div>
   <div id="opList" style="display:flex;flex-direction:column;gap:8px">${L.length?L.map(p=>`<div class="proj ${p.status||''}" data-id="${p.id}" tabindex="0"><b>${esc(p.name)}</b><div class="meta"><span class="pchip">${esc(PL[p.plant]?.short||'Regional')}</span><span>${esc(p.type||'')}</span>${phaseBar(p.phase)}<span>${esc(STN[p.status||'gris'])}</span>${p.owner?`<span>· ${esc(p.owner)}</span>`:''}${typeof p.x==='number'?'<span>· 📍 en plano</span>':''}</div>${openId===p.id?`<p class="note">${esc(p.note||'')}</p><div class="row">${typeof p.x==='number'||p.zone?`<button class="btn sm prim" data-go="${p.id}">Ir al proyecto</button>`:''}<button class="btn sm" data-ed="${p.id}" ${DB?'':'disabled'}>Editar</button>${p.link?`<a class="btn sm" href="${esc(p.link)}" target="_blank" rel="noopener">Abrir enlace ↗</a>`:''}</div>`:''}</div>`).join(''):`<p class="note">${PROJ.length?'Ningún proyecto con ese filtro.':'Todavía no hay proyectos. Agrega el primero con “+ Nuevo proyecto”.'}</p>`}</div>`;
  $('#opPl').value=opexF.plant;
  $('#opPl').addEventListener('change',e=>{ opexF.plant=e.target.value; renderOpex(); });
  body().querySelectorAll('#opSt button').forEach(b=>b.addEventListener('click',()=>{ opexF.st=b.dataset.v; renderOpex(); }));
  $('#opNew').addEventListener('click',()=>{ opexEdit={plant:CUR||'',status:'gris',type:'DMAIC',phase:'Define'}; renderOpex(); });
  $('#opCsv').addEventListener('click',()=>downloadCSV('portafolio_opex.csv',[['Proyecto','Planta','Tipo','Fase','Estado','Responsable','Zona','x','z','Nota','Enlace'],...PROJ.map(p=>[p.name,PL[p.plant]?.name||'Regional',p.type,p.phase,STN[p.status||'gris'],p.owner,p.zone,p.x,p.z,p.note,p.link])]));
  body().querySelectorAll('.proj').forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('button,a')) return; renderOpex(openId===el.dataset.id?null:el.dataset.id); }));
  body().querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>goProject(PROJ.find(p=>p.id===b.dataset.go))));
  body().querySelectorAll('[data-ed]').forEach(b=>b.addEventListener('click',()=>{ opexEdit={...PROJ.find(p=>p.id===b.dataset.ed)}; renderOpex(); }));
  if(openId){ const el=body().querySelector(`.proj[data-id="${openId}"]`); el&&el.scrollIntoView({block:'nearest'}); }
}
function goProject(p){ if(!p||!PL[p.plant]||PL[p.plant].ghost){ if(p&&PL[p.plant]) onPlantClick(p.plant); return; }
  const z=(PL[p.plant].zones||[]).find(z=>z.n===p.zone);
  const msg = typeof p.x==='number' ? {cmd:'focus',x:p.x,z:p.z,r:26,label:p.name} : z ? (z.rect?{cmd:'highlight',x0:z.rect[0],z0:z.rect[1],x1:z.rect[2],z1:z.rect[3],label:p.name}:{cmd:'focus',x:z.x,z:z.z,r:30,label:p.name}) : null;
  enterPlant(p.plant, msg?[msg]:null); }
function renderOpexForm(p){
  const zones=(PL[p.plant]?.zones||[]);
  body().innerHTML=`<h3>${p.id?'Editar proyecto':'Nuevo proyecto'}</h3>
   <div class="f"><label for="pfN">Nombre</label><input id="pfN" value="${esc(p.name||'')}" placeholder="Ej. Kaizen contención Línea 1"></div>
   <div class="f"><label for="pfP">Planta</label><select id="pfP">${PLANT_OPTS}<option value="regional">Regional / varias</option></select></div>
   <div class="f"><label for="pfT">Tipo</label><select id="pfT">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
   <div class="f"><label for="pfF">Fase</label><select id="pfF">${[...PHASES,'Planeación','Cerrado'].map(t=>`<option>${t}</option>`).join('')}</select></div>
   <div class="f"><span>Estado</span><div class="seg" id="pfS">${['verde','ambar','rojo','gris'].map(k=>`<button data-v="${k}" class="${k} ${(p.status||'gris')===k?'on':''}">${STN[k]}</button>`).join('')}</div></div>
   <div class="f"><label for="pfO">Responsable</label><input id="pfO" value="${esc(p.owner||'')}" placeholder="Nombre de quien lo lidera"></div>
   <div class="f"><label for="pfZ">Zona</label><select id="pfZ"><option value="">— sin zona —</option>${zones.map(z=>`<option ${z.n===p.zone?'selected':''}>${esc(z.n)}</option>`).join('')}</select></div>
   <div class="f"><span>En el plano</span><div class="row"><span class="mono" id="pfXY">${typeof p.x==='number'?`x ${p.x} · z ${p.z}`:'sin punto'}</span><button class="btn sm" id="pfPick" ${PL[p.plant]&&!PL[p.plant].ghost?'':'disabled'}>Colocar en el plano</button>${typeof p.x==='number'?'<button class="btn sm" id="pfClr">Quitar</button>':''}</div></div>
   <div class="f"><label for="pfNo">Nota</label><textarea id="pfNo" placeholder="Y, meta, siguiente paso">${esc(p.note||'')}</textarea></div>
   <div class="f"><label for="pfL">Enlace</label><input id="pfL" value="${esc(p.link||'')}" placeholder="https:// (charter, tablero, carpeta)"></div>
   <div class="row"><button class="btn prim" id="pfSave">Guardar</button><button class="btn" id="pfCancel">Cancelar</button>${p.id?'<span style="flex:1"></span><button class="btn" id="pfDel" style="color:var(--bad)">Eliminar</button>':''}</div>`;
  $('#pfP').value=p.plant||'regional'; $('#pfT').value=p.type||'DMAIC'; $('#pfF').value=p.phase||'Define';
  const grab=()=>{ p.name=$('#pfN').value.trim(); p.plant=$('#pfP').value==='regional'?'':$('#pfP').value; p.type=$('#pfT').value; p.phase=$('#pfF').value; p.owner=$('#pfO').value.trim(); p.zone=$('#pfZ').value; p.note=$('#pfNo').value.trim(); p.link=$('#pfL').value.trim(); };
  $('#pfP').addEventListener('change',()=>{ grab(); delete p.x; delete p.z; p.zone=''; renderOpexForm(p); });
  body().querySelectorAll('#pfS button').forEach(b=>b.addEventListener('click',()=>{ p.status=b.dataset.v; body().querySelectorAll('#pfS button').forEach(x=>x.classList.toggle('on',x===b)); }));
  $('#pfPick').addEventListener('click',()=>{ grab(); startPick(p); });
  $('#pfClr')?.addEventListener('click',()=>{ grab(); delete p.x; delete p.z; renderOpexForm(p); });
  $('#pfCancel').addEventListener('click',()=>{ opexEdit=null; renderOpex(); });
  $('#pfSave').addEventListener('click',async()=>{ grab(); if(!p.name){ toast('Ponle nombre al proyecto'); return; } if(!DB) return;
    const id=p.id||('pr_'+Date.now().toString(36)); const doc={name:p.name,plant:p.plant||'',type:p.type,phase:p.phase,status:p.status||'gris',owner:p.owner||'',zone:p.zone||'',note:p.note||'',link:p.link||'',updated:new Date().toISOString(),by:ME||null};
    if(typeof p.x==='number'){ doc.x=p.x; doc.z=p.z; }
    try{ await DB.doc('portfolio/'+id).set(doc); opexEdit=null; toast('Proyecto guardado'); renderOpex(id); }catch(e){ toast('No se guardó ('+(e?.code||'error')+'). Necesitas acceso de colaborador.'); } });

let PICKING=null;
function startPick(p){ PICKING=p; enterPlant(p.plant,[{cmd:'pick'}]); $('#pickbar').hidden=false; closeDrawer(); }
$('#pickCancel').addEventListener('click',()=>{ PICKING=null; $('#pickbar').hidden=true; openDrawer('opex'); });

const CATS=[['S','Seguridad','Incidentes y casi accidentes del día','verde: 0 · ámbar: casi accidente · rojo: incidente'],['Q','Calidad','% contención, PPM o quejas de cliente','verde: en meta · ámbar: fuera de meta · rojo: queja o contención abierta'],['D','Entrega','% cumplimiento del plan del turno','verde: ≥ 95 % · ámbar: 85–95 % · rojo: < 85 %'],['C','Costo','% scrap contra meta','verde: en meta · ámbar: hasta +20 % · rojo: > +20 %'],['P','Personal','Ausentismo y puestos sin cubrir','verde: cubiertos · ámbar: con apoyo · rojo: puesto crítico sin cubrir']];

function runSearch(q){
  const box=$('#sres'); const terms=norm(q).split(/\s+/).filter(Boolean);
  if(!terms.length){ box.hidden=true; return; }
  const pool=[...SIDX, ...PROJ.map(p=>({t:p.name,k:'proyecto',plant:p.plant,proj:p.id,n:norm(p.name+' '+(p.owner||'')+' '+(p.type||''))})), ...FLOWS.map(f=>({t:`${PL[f.from]?.short} → ${PL[f.to]?.short} · ${f.what||''}`,k:'flujo',flow:f.id,n:norm((f.what||'')+' '+PL[f.from]?.name+' '+PL[f.to]?.name)}))];
  sList=pool.filter(e=>terms.every(t=>e.n.includes(t)||norm(PL[e.plant]?.short).includes(t))).map(e=>({e,s:(e.n.startsWith(terms[0])?2:0)+(e.k==='planta'?3:0)+(e.k==='proyecto'?1:0)})).sort((a,b)=>b.s-a.s).slice(0,14).map(x=>x.e);
  sSel=0;

  box.hidden=false; box.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown',ev=>{ ev.preventDefault(); pickResult(sList[+b.dataset.i]); }));
}
function pickResult(e){ if(!e) return; $('#sres').hidden=true; $('#q').blur(); stopTour();
  if(e.k==='proyecto'){ const p=PROJ.find(x=>x.id===e.proj); openDrawer('opex'); renderOpex(p.id); goProject(p); return; }
  if(e.k==='flujo'){ openDrawer('flujos'); renderFlows(e.flow); return; }
  if(e.k==='planta'){ onPlantClick(e.plant); return; }
  if(e.preset){ enterPlant(e.plant,[{cmd:'preset',k:e.preset}]); return; }
  if(e.rect){ enterPlant(e.plant,[{cmd:'highlight',x0:e.rect[0],z0:e.rect[1],x1:e.rect[2],z1:e.rect[3],label:e.t}]); return; }
  if(typeof e.x==='number') enterPlant(e.plant,[{cmd:'focus',x:e.x,z:e.z,r:26,label:e.t}]);
}

/* =================================================================== LOOP */
const _v=new THREE.Vector3(); let last=performance.now();
function updateScale(){ const d=camera.position.distanceTo(controls.target); const h=2*d*Math.tan(camera.fov*Math.PI/360); const kmPerPx=h/innerHeight; const nice=[1,2,5,10,20,50,100]; let km=nice.find(n=>n/kmPerPx>60)||100; $('#scale').firstChild.textContent=km+' km'; $('#scaleI').style.width=Math.round(km/kmPerPx)+'px'; }
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(MODE!=='red') return;
  if(tween){ tween.t+=dt/tween.dur; const k=tween.t>=1?1:(tween.t<.5?4*tween.t**3:1-Math.pow(-2*tween.t+2,3)/2); camera.position.lerpVectors(tween.P0,tween.P1,k); controls.target.lerpVectors(tween.T0,tween.T1,k); camera.lookAt(controls.target); if(tween.t>=1){ const r=tween.res; tween=null; r(); } }
  else controls.update();
  FLOW_OBJS.forEach(o=>{ const a=o.pts.geometry.attributes.position; for(let i=0;i<o.n;i++){ const t=((now/1000)*(o.km>20?.05:.18)+i/o.n+o.ph)%1; const p=o.curve.getPoint(t); a.setXYZ(i,p.x,p.y,p.z); } a.needsUpdate=true; });
  const dist=camera.position.distanceTo(controls.target); const far=dist>46;
  const W=innerWidth,H=innerHeight;
  LABELS.forEach(L=>{ let show=true;
    if(L.plant) show = !(L.cluster && far);
    if(L.isCluster) show = far;
    if(L.flow!==undefined) show = L.near ? !far : true;
    if(!show){ L.el.style.display='none'; return; }
    _v.copy(L.pos).project(camera); if(_v.z>1||Math.abs(_v.x)>1.2||Math.abs(_v.y)>1.2){ L.el.style.display='none'; return; }
    L.el.style.display=''; L.el.style.transform=`translate(${(_v.x*.5+.5)*W}px,${(-_v.y*.5+.5)*H}px) translate(-50%,${L.el.classList.contains('city')||L.el.classList.contains('flow')?'-50%':'-100%'})`; });
  ORDER.forEach(id=>{ const p=PL[id]; if(p.halo.material.opacity>0){ p.halo.scale.setScalar(1+.06*Math.sin(now/400)); } });
  updateScale();
  renderer.render(scene,camera);
}
